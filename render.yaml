services:
  - type: web
    name: ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 4 --timeout 120 app.main:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLED_CHAOS
        value: "true"
      - key: ENABLED_MODERATION
        value: "true"
      - key: ENABLED_GAMES
        value: "true"
      - key: ENABLED_PROACTIVE
        value: "true"
      - key: AI_MIN_SCORE
        value: "34"
      - key: CALLBACK_MIN_AGE_SECONDS
        value: "300"
      - key: PROACTIVE_QUIET_SECONDS
        value: "600"
