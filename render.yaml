services:
  - type: web
    name: almirfawya-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k gthread --threads 4 --timeout 120 app.main:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: INFO
      - key: REPLY_CHANCE
        value: "0.80"
      - key: MIN_COOLDOWN_SECONDS
        value: "0"
      - key: MAX_COOLDOWN_SECONDS
        value: "2"
      - key: SOFT_HOURLY_LIMIT
        value: "20"
      - key: HARD_HOURLY_LIMIT
        value: "30"
      - key: MAX_CONSECUTIVE_BOT_MESSAGES
        value: "2"
      - key: ENABLED_CHAOS
        value: "true"
      - key: ENABLED_MODERATION
        value: "true"
      - key: ENABLED_GAMES
        value: "true"
      - key: ENABLED_PROACTIVE
        value: "true"
      - key: PROACTIVE_CHANCE
        value: "0.55"
      - key: PROACTIVE_MIN_INTERVAL
        value: "14400"
      - key: PROACTIVE_MAX_INTERVAL
        value: "43200"
      - key: PROACTIVE_MIN_MESSAGES
        value: "30"
      - key: PROACTIVE_MAX_MESSAGES
        value: "90"
      - key: PROACTIVE_QUIET_START
        value: "0"
      - key: PROACTIVE_QUIET_END
        value: "6"
      - key: PROACTIVE_REST_MINUTES
        value: "12"
      - key: PROACTIVE_REST_EVERY_HOURS
        value: "6"
      - key: AI_MIN_SCORE
        value: "34"
      - key: CALLBACK_MIN_AGE_SECONDS
        value: "300"
      - key: PROACTIVE_QUIET_SECONDS
        value: "0"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "480"
